server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: wallet-core

  datasource:
    # url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_wallet}
    # username: ${DB_USERNAME:wallet_user}
    # password: ${DB_PASSWORD:wallet_password}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      # host: ${REDIS_HOST: localhost}
      # port: ${REDIS_PORT: 6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  window: ${RATE_LIMIT_WINDOW:1m}
  default-limit: ${RATE_LIMIT_DEFAULT:120}
  auth-limit: ${RATE_LIMIT_AUTH:20}
  money-movement-limit: ${RATE_LIMIT_MONEY:30}

wallet:
  limits:
    daily-money-movement: ${WALLET_DAILY_MONEY_MOVEMENT_LIMIT:50000000}
    zone: ${WALLET_LIMIT_ZONE:UTC}
  fraud:
    challenge-amount: ${WALLET_FRAUD_CHALLENGE_AMOUNT:10000000}
    block-amount: ${WALLET_FRAUD_BLOCK_AMOUNT:100000000}

momo:
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: ${MOMO_ENDPOINT}
  redirect-url: ${MOMO_REDIRECT_URL}
  ipn-url: ${MOMO_IPN_URL}
