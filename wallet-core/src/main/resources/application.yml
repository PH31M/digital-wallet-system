spring:
    application:
        name: wallet-core
    
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_wallet}
        username: ${DB_USERNAME:wallet_user}
        password: ${DB_PASSWORD:wallet_password}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    
    flyway:
        enabled: true
        locations: classpath:db/migration

    data:
        redis:
            host: ${REDIS_HOST: localhost}
            port: ${REDIS_PORT: 6379}
    
    jwt:
        secret: ${JWT_SECRET:default_secret_key}
        access-token-expiry: 3600000
        refresh-token-expiry: 604800000
